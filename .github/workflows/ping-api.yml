# Ping l'API en production pour éviter la mise en veille (Render) ou surveiller l'uptime.
# Définir le secret repository : API_HEALTH_URL = https://votre-service.onrender.com/api/health/ping

name: Ping API

on:
  schedule:
    # Toutes les 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /api/health/ping
        run: |
          curl -fsS --max-time 30 "${{ secrets.API_HEALTH_URL }}"
